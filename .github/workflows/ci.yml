# CI for forward-mobile: the `check` job runs tsc and jest on every pull request to main and every push to main,
# as a matrix over three time zones, so the required status checks are `check (UTC)`,
# `check (America/Argentina/Buenos_Aires)` and `check (Asia/Tokyo)`. The `publish-update` job only runs on push to main
# and is not a required check. Making the `check` entries required on `main` is done by the repository owner in GitHub branch protection.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled by a newer push; a run on main is never cut mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'America/Argentina/Buenos_Aires', 'Asia/Tokyo']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:eslint
      - run: npm run knip
      - name: Audit production dependencies (high and critical)
        run: node scripts/audit-ci.mjs
      - run: npm test -- --ci
        env:
          TZ: ${{ matrix.tz }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ strategy.job-index }}
          path: junit.xml
          retention-days: 7

  # Shared-code and contract gate (ARQ-01): libs/reglas, libs/validations/generated and the generated API types
  # must match forward-system's main. forward-system is private: the job needs the FORWARD_SYSTEM_READ_TOKEN secret
  # (a read-only token for that repo). Without it only the hash of each copy is verified and a notice says so.
  # It is not part of the `check` matrix, so the required status check names do not change.
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SOURCE_TOKEN: ${{ secrets.FORWARD_SYSTEM_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SOURCE_TOKEN == 'true'
        with:
          repository: DamianBosatta/forward-system
          ref: main
          token: ${{ secrets.FORWARD_SYSTEM_READ_TOKEN }}
          path: forward-system
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contract checks against forward-system
        if: env.HAS_SOURCE_TOKEN == 'true'
        env:
          FORWARD_SYSTEM_REPO: forward-system
          FORWARD_SYSTEM_REF: HEAD
          CHECK_REGLAS_EXIGIR_FUENTE: '1'
          CHECK_VALIDACIONES_EXIGIR_FUENTE: '1'
        run: |
          npm run check:reglas
          npm run check:validaciones
          npm run check:types
      - name: Contract checks (hash of each copy only)
        if: env.HAS_SOURCE_TOKEN != 'true'
        run: |
          echo "::warning::FORWARD_SYSTEM_READ_TOKEN is not set: the copies were not compared with forward-system (ARQ-01)."
          npm run check:reglas
          npm run check:validaciones

  # Publishes the JS bundle of every merge to main as an EAS Update on the `production` channel.
  # The fingerprint runtime version keeps it away from builds with different native code (docs/RELEASE.md).
  publish-update:
    needs: [check, contrato]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: publish-update
      cancel-in-progress: false
    steps:
      - name: Check EXPO_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EXPO_TOKEN is not set: no update was published (see docs/RELEASE.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.token.outputs.ready == 'true'
        run: npm ci
      # `eas update --environment` reads EAS environment variables, not the build env of eas.json:
      # load the production build env from eas.json so the bundle gets the same EXPO_PUBLIC_* values.
      - name: Load production env from eas.json
        if: steps.token.outputs.ready == 'true'
        run: |
          node -e '
            const fs = require("fs")
            const env = require("./eas.json").build.production.env
            for (const [k, v] of Object.entries(env)) {
              if (/[\r\n]/.test(v)) throw new Error("multi-line value in eas.json: " + k)
              fs.appendFileSync(process.env.GITHUB_ENV, k + "=" + v + "\n")
            }
          '
          test -n "$(grep '^EXPO_PUBLIC_API_URL=' "$GITHUB_ENV")"
      - if: steps.token.outputs.ready == 'true'
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9.0.2
        with:
          # Pinned on purpose (last green publish run); bump it deliberately in a PR.
          eas-version: 27.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update to production
        if: steps.token.outputs.ready == 'true'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: eas update --channel production --environment production --message "$MSG" --non-interactive
      # OPS-R4-01: a fingerprint runtime with no installed build receives the update on no phone and the job stays green.
      # Compares the runtime of the latest update of the production branch (the one just published) with the one of the latest finished production Android build.
      # Warning only: never fails the job. Prints runtime versions and a verdict, nothing else from the CLI output.
      - name: Check that a production build has this runtime
        if: steps.token.outputs.ready == 'true'
        continue-on-error: true
        run: |
          eas update:list --branch production --platform android --limit 1 --json --non-interactive > "$RUNNER_TEMP/update.json" 2> /dev/null || true
          eas build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive > "$RUNNER_TEMP/build.json" 2> /dev/null || true
          node -e '
            const fs = require("fs")
            // The runtime lives on the update group of the production branch: `currentPage[0].runtimeVersion` (OPS-R4B-01).
            // Build list items carry it as `runtime.version`. Any other shape reads as unknown and warns instead of guessing.
            const first = (v) => (Array.isArray(v) ? v[0] : v && Array.isArray(v.currentPage) ? v.currentPage[0] : Array.isArray(v && v.builds) ? v.builds[0] : v)
            const find = (v) => {
              const item = first(v)
              if (!item || typeof item !== "object") return null
              if (typeof item.runtimeVersion === "string") return item.runtimeVersion
              if (item.runtime && typeof item.runtime.version === "string") return item.runtime.version
              return null
            }
            const read = (f) => { try { return find(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/" + f, "utf8"))) } catch { return null } }
            const update = read("update.json")
            const build = read("build.json")
            const summary = process.env.GITHUB_STEP_SUMMARY
            let msg
            if (!update || !build) {
              msg = "Could not read the runtime version of the update (" + (update ?? "unknown") + ") or of the latest production Android build (" + (build ?? "unknown") + "): check expo.dev by hand (docs/RELEASE.md)."
            } else if (update !== build) {
              msg = "The update runtime " + update + " differs from the runtime " + build + " of the latest finished production Android build: no installed phone receives this update. A new APK is needed (docs/RELEASE.md)."
            } else {
              console.log("Update runtime " + update + " matches the latest production Android build.")
              if (summary) fs.appendFileSync(summary, "Update runtime " + update + " matches the latest production Android build.\n")
              process.exit(0)
            }
            console.log("::warning::" + msg)
            if (summary) fs.appendFileSync(summary, "**Warning:** " + msg + "\n")
          '
