# CI for forward-mobile: one job (`check`) runs tsc and jest on every pull request to main and every push to main.
# Making `check` a required status check on `main` is done by the repository owner in GitHub branch protection.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          retention-days: 7
